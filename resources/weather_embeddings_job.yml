resources:
  jobs:
    weather_embeddings_job:
      name: weather-embeddings-refresh
      description: Refresh NWS documents, then chunk and embed changes into Lakebase.
      tasks:
        - task_key: sync_weather_documents
          spark_python_task:
            python_file: ../scripts/sync_weather_documents.py
            parameters:
              - --locations
              - Chicago, IL
              - Austin, TX
              - Miami, FL
              - --limit
              - "50"
          environment_key: default
          max_retries: 2
          min_retry_interval_millis: 60000
        - task_key: embed_weather_documents
          depends_on:
            - task_key: sync_weather_documents
          spark_python_task:
            python_file: ../notebooks/ingest_weather_embeddings.py
            parameters:
              - --fetch-batch-size
              - "64"
              - --embedding-batch-size
              - "32"
              - --chunk-size
              - "800"
              - --chunk-overlap
              - "100"
          environment_key: default
          max_retries: 2
          min_retry_interval_millis: 60000
      environments:
        - environment_key: default
          spec:
            environment_version: "2"
            dependencies:
              - databricks-sdk>=0.30.0
              - psycopg2-binary>=2.9.9
              - requests>=2.32.3
              - sentence-transformers>=3.0.1
      schedule:
        quartz_cron_expression: "0 0/30 * * * ?"
        timezone_id: America/Chicago
        pause_status: PAUSED
