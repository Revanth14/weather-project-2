command:
  - gunicorn
  - app:app
  - --bind
  - 0.0.0.0:${DATABRICKS_APP_PORT}
  - --workers
  - "1"
  - --threads
  - "4"
  - --timeout
  - "180"

env:
  - name: LAKEBASE_SECRET_SCOPE
    value: database
  - name: LAKEBASE_SECRET_KEY
    value: lakebase-url
  - name: NWS_USER_AGENT
    value: weather-intelligence-homework/1.0 (https://github.com/Revanth14)
  - name: WEATHER_EMBEDDING_MODEL
    value: sentence-transformers/all-MiniLM-L6-v2
